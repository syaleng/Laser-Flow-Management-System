name: laserflow-production

services:
  db:
    image: postgres:17-alpine
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./backend
      target: production
    restart: always
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - backups_data:/app/backups
    expose: ["8000"]
    networks: [internal]

  backup:
    build:
      context: ./backend
      target: production
    restart: always
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
    command: ["/bin/sh", "-c", "while true; do python manage.py create_system_backup --retain 14; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media:ro
      - backups_data:/app/backups
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
    restart: always
    expose: ["80"]
    networks: [internal]

  proxy:
    image: nginx:1.27-alpine
    restart: always
    depends_on: [backend, frontend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks: [internal]

volumes:
  postgres_data:
  static_data:
  media_data:
  backups_data:

networks:
  internal:
