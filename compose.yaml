name: laserflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laserflow}
      POSTGRES_USER: ${POSTGRES_USER:-laserflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laserflow} -d ${POSTGRES_DB:-laserflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [laserflow]

  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [laserflow]

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on: [backend]
    networks: [laserflow]

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  laserflow:
